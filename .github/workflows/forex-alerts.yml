
name: Forex Telegram Signal Alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  check-forex-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send one Telegram test message
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          url = "https://api.telegram.org/bot" + token + "/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": "TEST: Your Forex Telegram signal bot is connected. No trade was placed."
          }).encode()

          request = urllib.request.Request(url, data=data)

          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode())

          if not result.get("ok"):
              raise SystemExit("Telegram rejected the test message.")

          print("Telegram test message sent successfully.")
          PY

      - name: Check market and send alerts
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_checker.py

      - name: Save signal-checking state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_signal.json
          if ! git diff --cached --quiet; then
            git commit -m "Update signal checker state"
            git push
          fi
          
