
      - name: Send one Telegram test message
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_BOT_TOKEN"] + "/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": "Test message: Your Forex Telegram signal bot is connected. This is only a test; no trade was placed."
          }).encode()
          request = urllib.request.Request(url, data=data)
          with urllib.request.urlopen(request, timeout=20) as response:
              result = json.loads(response.read().decode())
          if not result.get("ok"):
              raise SystemExit("Telegram rejected the test message.")
          print("Telegram test message sent successfully.")
          PY
          
